plugins { id 'com.android.application' }
android {
    namespace 'com.desktopmelee.android'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.desktopmelee.android'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.0.1-overlay-prototype'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}
