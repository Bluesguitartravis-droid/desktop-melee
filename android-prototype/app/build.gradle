plugins { id 'com.android.application' }
android {
    namespace 'com.desktopmelee.android'
    compileSdk 35
    buildToolsVersion '35.0.0'
    signingConfigs {
        prototype {
            storeFile rootProject.file('signing/desktopmelee-prototype.p12')
            storePassword 'desktopmelee-prototype'
            keyAlias 'desktopmelee-test'
            keyPassword 'desktopmelee-prototype'
            storeType 'PKCS12'
        }
    }
    defaultConfig {
        applicationId 'com.desktopmelee.android'
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName '0.0.3-stable-signing'
    }
    ndkVersion '27.2.12479018'
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
    }
    defaultConfig {
        externalNativeBuild { cmake { cppFlags '-std=c++20' } }
    }
    buildTypes {
        debug { signingConfig signingConfigs.prototype }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}
