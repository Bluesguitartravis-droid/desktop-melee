name: Publish Android full Desktop Melee 0.1.2
on:
  push:
    branches: [android-full-desktop]
    paths: [".github/workflows/android-full-publish.yml"]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download validated full APK artifact
        run: |
          mkdir deliver
          gh run download 40965231407 --repo "$GITHUB_REPOSITORY" --name Desktop-Melee-Android-Full-0.1.2 --dir deliver
          cd deliver
          EXPECTED="$(awk 'NR==1 {print $1}' SHA256SUMS)"
          printf '%s  %s\n' "$EXPECTED" Desktop-Melee-Android-Full-0.1.2.apk | sha256sum --check -
          grep -F "package: name='com.desktopmelee.android'" APK-VERIFICATION.txt
          grep -F "versionCode='6'" APK-VERIFICATION.txt
      - name: Publish prerelease
        run: |
          cd deliver
          TAG="android-full-v0.1.2-preview.3"
          printf '%s\n' '# Desktop Melee Android Full 0.1.2 - updater preview 3' '' 'Adds the built-in Android Full updater to the full native Desktop Melee APK.' '' '- Same com.desktopmelee.android package and stable signing certificate; versionCode 6.' '- Automatically checks the GitHub Android Full release channel at startup, at most once every six hours by default.' '- Manual Check for updates now button plus a default-on automatic-check toggle.' '- Only considers android-full-v release tags and Desktop-Melee-Android-Full APK assets.' '- Downloads updates with Android DownloadManager and verifies GitHub\'s published SHA-256 digest before installation.' '- Opens the normal Android package installer; user confirmation is still required.' '- Android may ask once to allow installs from Desktop Melee; returning to the app resumes the verified install.' '- Version-specific download filenames avoid stale APK collisions.' '- Home-screen transparency preview, orientation-aware combat areas, 2-4 fighters, controller/touch support and native Vulkan engine remain included.' '' 'No disc image or copyrighted game data is included.' > RELEASE-NOTES.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Desktop Melee Android Full 0.1.2 - updater preview 3" --notes-file RELEASE-NOTES.md
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target android-full-desktop --prerelease --latest=false --title "Desktop Melee Android Full 0.1.2 - updater preview 3" --notes-file RELEASE-NOTES.md Desktop-Melee-Android-Full-0.1.2.apk APK-VERIFICATION.txt SHA256SUMS
