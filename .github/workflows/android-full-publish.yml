name: Publish Android full Desktop Melee 0.1.0
on:
  push:
    branches: [android-full-desktop]
    paths: [".github/workflows/android-full-publish.yml"]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download validated full APK artifact
        run: |
          mkdir deliver
          gh run download 40928770007 --repo "$GITHUB_REPOSITORY" --name Desktop-Melee-Android-Full-0.1.0 --dir deliver
          cd deliver
          sha256sum --check SHA256SUMS
          grep -F "package: name='com.desktopmelee.android'" APK-VERIFICATION.txt
          grep -F "versionCode='4'" APK-VERIFICATION.txt
      - name: Publish prerelease
        run: |
          cd deliver
          TAG="android-full-v0.1.0-preview.1"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "Release already exists"; exit 1; fi
          cat > RELEASE-NOTES.md <<'NOTES'
# Desktop Melee Android Full 0.1.0 - preview 1

First APK built from the repository's full native Android Melee engine rather than the placeholder overlay prototype.

- Uses the same com.desktopmelee.android package and stable test signing certificate established by Android prototype 0.0.3 (versionCode 4), so it is intended to install directly over 0.0.3.
- Adds a pre-game Desktop Melee setup screen.
- Orientation: Auto, Landscape, or Portrait.
- Separate landscape and portrait combat-area profiles with adjustable horizontal margins and floor height.
- Choose 2, 3, or 4 fighters, Player 1 vs CPUs or Watch CPUs, CPU level, and stocks before launch.
- Launches the full native Android Melee port and its existing disc picker, graphics/audio settings, touch/controller support, caches, and Vulkan renderer.
- Desktop Melee collision/camera/spawn rules use Android combat-area geometry sampled when each match begins.

Current limitation: this first full-engine preview renders in the ordinary foreground Android game activity. It does not yet make the native Vulkan game surface transparent over the Android Home screen. The prior overlay prototype proved Android overlay/controller behavior; transparent native-game presentation is the next integration step.

No disc image or game data is included. Select your own local USA 1.02 disc image in the game launcher.
NOTES
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target android-full-desktop --prerelease --latest=false --title "Desktop Melee Android Full 0.1.0 - preview 1" --notes-file RELEASE-NOTES.md Desktop-Melee-Android-Full-0.1.0.apk APK-VERIFICATION.txt SHA256SUMS
