name: Publish Android full Desktop Melee 0.1.1
on:
  push:
    branches: [android-full-desktop]
    paths: [".github/workflows/android-full-publish.yml"]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download validated full APK artifact
        run: |
          mkdir deliver
          gh run download 40962523211 --repo "$GITHUB_REPOSITORY" --name Desktop-Melee-Android-Full-0.1.1 --dir deliver
          cd deliver
          EXPECTED="$(awk 'NR==1 {print $1}' SHA256SUMS)"
          printf '%s  %s\n' "$EXPECTED" Desktop-Melee-Android-Full-0.1.1.apk | sha256sum --check -
          grep -F "package: name='com.desktopmelee.android'" APK-VERIFICATION.txt
          grep -F "versionCode='5'" APK-VERIFICATION.txt
      - name: Publish prerelease
        run: |
          cd deliver
          TAG="android-full-v0.1.1-preview.2"
          printf '%s\n' '# Desktop Melee Android Full 0.1.1 - transparent preview 2' '' 'First full-engine Android build with the Home-screen transparency path wired into the native renderer.' '' '- Same com.desktopmelee.android package and stable signing certificate; versionCode 5.' '- Home-screen overlay toggle with normal foreground-rendering fallback.' '- Translucent Android game Activity and SDL SurfaceView.' '- Premultiplied-alpha Vulkan/WebGPU surface with the Desktop Melee alpha-preserving present shader.' '- Play mode keeps controller focus; Watch mode makes the game window non-touchable and non-focusable so the Home screen can remain interactive underneath.' '- Orientation: Auto, Landscape, or Portrait.' '- Separate landscape and portrait horizontal-margin and floor-height profiles.' '- 2, 3, or 4 fighters; Player 1 vs CPUs or Watch CPUs; CPU level and stocks.' '- Full native Android disc picker, graphics/audio settings, touch/controller support, caches and Vulkan renderer.' '' 'Physical-device note: compile, signing and package validation passed. Home-screen composition still needs testing on the Odin 3 Ultra GPU/compositor.' '' 'No disc image or copyrighted game data is included. Select your own local USA 1.02 disc image.' > RELEASE-NOTES.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Desktop Melee Android Full 0.1.1 - transparent preview 2" --notes-file RELEASE-NOTES.md
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target android-full-desktop --prerelease --latest=false --title "Desktop Melee Android Full 0.1.1 - transparent preview 2" --notes-file RELEASE-NOTES.md Desktop-Melee-Android-Full-0.1.1.apk APK-VERIFICATION.txt SHA256SUMS
