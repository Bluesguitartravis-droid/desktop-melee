name: Publish Android full Desktop Melee 0.1.3
on:
  push:
    branches: [android-full-desktop]
    paths: [".github/workflows/android-full-publish.yml"]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download validated full APK artifact
        run: |
          mkdir deliver
          gh run download 40965980480 --repo "$GITHUB_REPOSITORY" --name Desktop-Melee-Android-Full-0.1.3 --dir deliver
          cd deliver
          EXPECTED="$(awk 'NR==1 {print $1}' SHA256SUMS)"
          printf '%s  %s\n' "$EXPECTED" Desktop-Melee-Android-Full-0.1.3.apk | sha256sum --check -
          grep -F "package: name='com.desktopmelee.android'" APK-VERIFICATION.txt
          grep -F "versionCode='7'" APK-VERIFICATION.txt
      - name: Publish prerelease
        run: |
          cd deliver
          TAG="android-full-v0.1.3-preview.4"
          printf '%s\n' '# Desktop Melee Android Full 0.1.3 - updater target preview 4' '' 'This is the first newer Android Full release intended to exercise the built-in updater from 0.1.2.' '' '- Same com.desktopmelee.android package and stable signing certificate; versionCode 7.' '- Includes the built-in Android Full updater from 0.1.2.' '- Keeps the transparent Home-screen path and adds safer overlay fallback handling.' '- Automatically checks GitHub Android Full releases at startup when enabled.' '- Uses SHA-256 verification before handing an APK to the Android installer.' '- Normal Android install confirmation is still required.' '' 'No disc image or copyrighted game data is included.' > RELEASE-NOTES.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Desktop Melee Android Full 0.1.3 - updater target preview 4" --notes-file RELEASE-NOTES.md
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target android-full-desktop --prerelease --latest=false --title "Desktop Melee Android Full 0.1.3 - updater target preview 4" --notes-file RELEASE-NOTES.md Desktop-Melee-Android-Full-0.1.3.apk APK-VERIFICATION.txt SHA256SUMS
