name: Publish Android full Desktop Melee 0.1.4
on:
  push:
    branches: [android-full-desktop]
    paths: [".github/workflows/android-full-publish.yml"]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify successful Android Full 0.1.4 build
        run: |
          set -euo pipefail
          gh run view 40972691952 --repo "$GITHUB_REPOSITORY" --json conclusion,headSha \
            --jq '.conclusion == "success" and .headSha == "a1eb3704da6da121834c1d3abd6d0a0ed80bd830"' | grep -Fx true
      - name: Download validated full APK artifact
        run: |
          set -euo pipefail
          mkdir deliver
          gh run download 40972691952 --repo "$GITHUB_REPOSITORY" --name Desktop-Melee-Android-Full-0.1.4 --dir deliver
          cd deliver
          EXPECTED="$(awk 'NR==1 {print $1}' SHA256SUMS)"
          printf '%s  %s\n' "$EXPECTED" Desktop-Melee-Android-Full-0.1.4.apk | sha256sum --check -
          grep -F "package: name='com.desktopmelee.android'" APK-VERIFICATION.txt
          grep -F "versionCode='8'" APK-VERIFICATION.txt
      - name: Publish Android Full 0.1.4 overlay test prerelease
        run: |
          set -euo pipefail
          cd deliver
          TAG="android-full-v0.1.4-preview.5"
          cat > RELEASE-NOTES.md <<'NOTES'
          # Desktop Melee Android Full 0.1.4 - system overlay test preview 5

          This test release targets the previous issue where the game would open only with overlay mode disabled. It is not yet verified on the Samsung Flip 3.

          - Switches the Android game presentation to a system overlay window path.
          - Adjusts overlay window input focus/touch behavior and watch-mode opacity.
          - Includes the native Android Full Melee engine and the built-in updater.
          - Uses the same package name (`com.desktopmelee.android`) and signing certificate as the earlier Android Full builds.
          - Android versionCode 8; intended as an in-place update from 0.1.3 (versionCode 7).

          **Test:** Grant Android's Display over other apps permission, start the app in overlay mode, and check whether the Home screen remains visible behind the fighters. Also check non-overlay mode for visible fighters/HUD. Please report any crash message or screenshot.

          This is a preview, not confirmation that the overlay problem is resolved. No copyrighted disc or game data is included.

          Verified source: `a1eb3704da6da121834c1d3abd6d0a0ed80bd830`
          Successful build: https://github.com/Bluesguitartravis-droid/desktop-melee/actions/runs/40972691952
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace an existing release."
            exit 1
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target android-full-desktop --prerelease --latest=false \
            --title "Desktop Melee Android Full 0.1.4 - overlay test preview 5" \
            --notes-file RELEASE-NOTES.md \
            Desktop-Melee-Android-Full-0.1.4.apk APK-VERIFICATION.txt SHA256SUMS
