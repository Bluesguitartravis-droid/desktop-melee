name: Android full Desktop Melee build
on:
  push:
    branches: [android-full-desktop]
    paths-ignore: [".github/workflows/android-full-publish.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.3.11579264
      MELEE_VERSION: 0.1.7-android-overlay-stability
      MELEE_UNSIGNED_RELEASE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and native toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu ninja-build cmake pkg-config python3
          rustup target add aarch64-linux-android
      - name: Build full native Android APK
        run: bash tools/build_android.sh
      - name: Sign with stable Desktop Melee prototype certificate
        run: |
          set -euo pipefail
          mkdir -p signing dist/signed
          gh release download android-prototype-signing-v1 --repo "$GITHUB_REPOSITORY"             --pattern prototype-signing.pk8 --pattern prototype-signing.x509.pem --dir signing
          ZIPALIGN="$ANDROID_HOME/build-tools/34.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$ZIPALIGN" -f -p 4 dist/Melee-Android-arm64.apk dist/signed/Desktop-Melee-Android-Full-0.1.7.apk
          "$APKSIGNER" sign --key signing/prototype-signing.pk8 --cert signing/prototype-signing.x509.pem             dist/signed/Desktop-Melee-Android-Full-0.1.7.apk
          "$APKSIGNER" verify --verbose --print-certs dist/signed/Desktop-Melee-Android-Full-0.1.7.apk             > dist/signed/APK-VERIFICATION.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging dist/signed/Desktop-Melee-Android-Full-0.1.7.apk             >> dist/signed/APK-VERIFICATION.txt
          grep -F "package: name='com.desktopmelee.android'" dist/signed/APK-VERIFICATION.txt
          grep -F "versionCode='11'" dist/signed/APK-VERIFICATION.txt
          sha256sum dist/signed/Desktop-Melee-Android-Full-0.1.7.apk > dist/signed/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Desktop-Melee-Android-Full-0.1.7
          compression-level: 0
          if-no-files-found: error
          path: dist/signed/

      - name: Publish Android Full 0.1.7 stability prerelease
        run: |
          set -euo pipefail
          cd dist/signed
          TAG="android-full-v0.1.7-preview.8"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          cat > RELEASE-NOTES.md <<NOTES
          # Desktop Melee Android Full 0.1.7 - overlay match-start stability

          Stability build targeting the Android crash reported immediately when a Desktop match starts.

          - Rolls back the experimental 0.1.6 renderer-level forced transparent EFB clears to the 0.1.5 behavior.
          - Keeps the Android system-overlay window path, solid fighter window alpha, 93% floor default, SDL-surface arena sizing, emergency STOP OVERLAY control, and crash diagnostics.
          - Keeps transparent Android surface composition available without forcing every EFB clear/resolve through the new 0.1.6 path.
          - Package remains com.desktopmelee.android and uses the same signing certificate; versionCode 11.

          This is a focused regression test build. No game disc data is included.

          Source commit: $GITHUB_SHA
          NOTES
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"             --prerelease --latest=false             --title "Desktop Melee Android Full 0.1.7 - overlay stability preview 8"             --notes-file RELEASE-NOTES.md             Desktop-Melee-Android-Full-0.1.7.apk APK-VERIFICATION.txt SHA256SUMS
